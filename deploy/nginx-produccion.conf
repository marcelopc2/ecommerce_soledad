# ============================================================================
# ingenioblocks.com — el sitio DE VERDAD (lo instala deploy/lanzamiento.sh).
#
# Es la misma configuración del sitio de prueba (pre.ingenioblocks.com) con
# tres diferencias a propósito:
#   1. SIN el "noindex" para Google: el sitio de prueba lo lleva para no competir
#      con la tienda; acá sería esconder la tienda de los buscadores.
#   2. robots.txt y sitemap.xml son los del sitio (frontend/public), no los que
#      cierran todo.
#   3. Los encabezados de seguridad se repiten en /index.html: nginx no hereda
#      add_header en un location que define los suyos, y sin esto la página
#      (incluido el login) se podía meter dentro de un iframe ajeno.
# www.ingenioblocks.com redirige a ingenioblocks.com.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ingenioblocks.com www.ingenioblocks.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://ingenioblocks.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ingenioblocks.com;
    ssl_certificate /etc/letsencrypt/live/ingenioblocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingenioblocks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://ingenioblocks.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ingenioblocks.com;
    ssl_certificate /etc/letsencrypt/live/ingenioblocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingenioblocks.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: el navegador entra siempre por HTTPS, aunque escriban http:// o
    # sigan un enlace viejo. 30 días, igual que lo que manda Django en la API.
    add_header Strict-Transport-Security "max-age=2592000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Las vueltas de Transbank y Mercado Pago van sin límite de velocidad: un
    # 429 acá es un pago cobrado que la tienda no registra.
    location = /api/payments/commit/ {
        proxy_pass http://ingenioblocks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
    location = /api/payments/mp-commit/ {
        proxy_pass http://ingenioblocks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
    location = /api/payments/mp-webhook/ {
        proxy_pass http://ingenioblocks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # ---- Direcciones del WordPress anterior ----
    # Google y los marcadores de la gente todavía las tienen. Un 301 a su
    # equivalente conserva el posicionamiento y no deja a nadie en una página
    # vacía. La lista sale del sitemap del WordPress (wp-sitemap.xml).
    location ~ ^/(tienda|comprar|carrito|finalizar-compra|pago|lista-de-deseos|planes-individuales|tipos-de-suscripcion|plan-institucional-emprendedor|sobre-nuestros-programas)/?$ {
        return 301 https://ingenioblocks.com/#kits;
    }
    location ~ ^/(producto|categoria-producto|pago-de-membresia)/ {
        return 301 https://ingenioblocks.com/#kits;
    }
    location ~ ^/(cuenta-del-usuario|cuenta-publica-del-usuario|student-public-account|instructor-public-account|instructor-registration-page)/?$ {
        return 301 https://ingenioblocks.com/mi-cuenta;
    }
    location ~ ^/cuenta-de-membresia(/.*)?$ {
        return 301 https://ingenioblocks.com/mi-cuenta;
    }
    location ~ ^/(pagina-de-cursos|courses-archive|courses-archive-gutenberg|certificate-page|recursos)/?$ {
        return 301 https://ingenioblocks.com/mis-cursos;
    }
    location ~ ^/contacto/?$                { return 301 https://ingenioblocks.com/#contacto; }
    location ~ ^/sobre-nosotros/?$          { return 301 https://ingenioblocks.com/#quienes-somos; }
    location ~ ^/preguntas-frecuentes/?$    { return 301 https://ingenioblocks.com/#preguntas-frecuentes; }
    location ~ ^/terminos-y-condiciones/?$  { return 301 https://ingenioblocks.com/legal/terminos; }
    location ~ ^/(concurso-creando-con-ingenio|galeria-de-ideas)/?$ {
        return 301 https://ingenioblocks.com/#concurso;
    }
    location ~ ^/(blog|home-2|feed|la-importancia-del-aprendizaje-practico-en-el-desarrollo-infantil|creatividad-y-pensamiento-critico-habilidades-clave-para-el-siglo-xxi|el-aprendizaje-basado-en-el-juego-beneficios-y-aplicaciones-en-la-educacion)/?$ {
        return 301 https://ingenioblocks.com/;
    }

    location ^~ /protected_media/ {
        deny all;
        return 404;
    }
    location /static/ {
        alias /srv/ingenioblocks/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/ingenioblocks/media/;
        expires 7d;
        access_log off;
    }

    location = /gestion/ingresar/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://ingenioblocks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
    location ~ ^/(api|gestion|admin|escritorio-ib|dev)/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://ingenioblocks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    root /srv/ingenioblocks/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=2592000" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
